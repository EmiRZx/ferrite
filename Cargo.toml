[package]
name = "ferrite"
version = "0.1.0"
edition = "2024"
description = "A from-scratch CPU inference engine for LLMs, written in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.19"
memmap2 = "0.9"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
