[package]
name = "ferrite"
version = "0.1.0"
edition = "2024"
description = "A from-scratch CPU inference engine for LLMs, written in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.19"
memmap2 = "0.9"
num_cpus = "1.17.0"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync"] }
unicode-normalization = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[lints.clippy]
# `chunks_exact(BLOCK)` reads better than `as_chunks::<BLOCK>().0.iter()` in the block loops.
chunks_exact_to_as_chunks = "allow"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
